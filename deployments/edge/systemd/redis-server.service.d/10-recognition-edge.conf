# Drop-in: budget + proteção de OOM para o Redis do edge (task-113).
# Instalar em /etc/systemd/system/redis-server.service.d/ (ou redis.service.d/).
# Complementa o maxmemory 384mb do redis-edge.conf (defesa em profundidade).
[Service]
MemoryHigh=512M
MemoryMax=640M
MemorySwapMax=128M
OOMScoreAdjust=-500
