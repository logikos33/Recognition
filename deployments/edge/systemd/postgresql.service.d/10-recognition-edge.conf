# Drop-in: budget de memória + proteção de OOM para o Postgres do edge (task-113).
# NÃO substitui a unit do pacote — só adiciona limites. Instalar em
# /etc/systemd/system/postgresql.service.d/  (ajustar o nome se a unit for
# postgresql@14-main.service). `systemctl daemon-reload` depois.
[Service]
MemoryHigh=384M
MemoryMax=640M
MemorySwapMax=256M
# Protegido (dados), mas ABAIXO do pipeline: se faltar RAM, morre antes do DeepStream.
OOMScoreAdjust=-700
