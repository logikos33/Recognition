# sysctl-edge.conf — pressão de VM para edge Jetson co-residente (task-113).
# Instalar em /etc/sysctl.d/99-recognition-edge.conf e `sysctl --system`.
# POR QUÊ: memória unificada + inferência + stack. Prioriza RAM para o pipeline,
# usa swap NVMe só para páginas frias, e mantém reserva atômica para NVMM.

# Prioriza páginas de RAM (inferência) sobre swap. 10 = só swapa quando necessário.
# Fonte: jetson-ai-lab RAM Optimization.
vm.swappiness = 10

# Menos pressão para descartar cache de inode/dentry (I/O de evidência/SQLite).
vm.vfs_cache_pressure = 50

# ~256 MB de reserva atômica. Reduz stalls de alocação NVMM/kernel sob pressão
# (o alocador de surfaces do DeepStream precisa de páginas contíguas rápidas).
vm.min_free_kbytes = 262144

# Flush mais cedo — evita picos de dirty pages competindo com a inferência por RAM.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# NÃO setar vm.overcommit_memory=2: quebra alocações esparsas grandes de GPU/NVMM.
# Mantém heurística padrão (0). Documentado de propósito.

# ── PSI (Pressure Stall Information) ────────────────────────────────────────────
# O soak MEDE /proc/pressure/{memory,cpu,io}. O kernel L4T 5.15 tem CONFIG_PSI,
# mas pode precisar de `psi=1` no cmdline (extlinux.conf) + reboot se
# /proc/pressure não existir. Verificar no box:  ls /proc/pressure/
# (edição do extlinux + reboot = SUDO/hands-on — pendência se PSI estiver off.)
