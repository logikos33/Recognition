# postgresql-edge.conf — Postgres de EDGE (não-servidor) para o soak (task-113).
# Instalar como include: em postgresql.conf -> `include_dir 'conf.d'` e colocar
# este arquivo em conf.d/ (ou copiar as linhas). Recarregar: `pg_ctl reload`.
# POR QUÊ: Postgres default assume servidor dedicado. No edge ele DIVIDE 16 GB
# unificados com a inferência — cada MB de shared_buffers é 1 MB a menos para NVMM.
# Config = pequeno e previsível, não "rápido a qualquer custo de RAM".

# Buffer de página pequeno (o teto do MemoryMax=640M do systemd cobre o resto).
shared_buffers = 256MB

# Dica ao planejador do cache de SO disponível (não aloca — só estimativa).
effective_cache_size = 1GB

# Poucas conexões: a API de edge usa um pool modesto; evita explosão de work_mem.
max_connections = 30
work_mem = 8MB
maintenance_work_mem = 64MB

# WAL contido — evita checkpoints gigantes disputando I/O com a evidência.
wal_buffers = 8MB
min_wal_size = 128MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# Edge: durabilidade relaxada por menos latência/IO. Eventos são re-deriváveis
# do relay; um crash perde no máximo os últimos ~ms. (Rever se a evidência exigir
# durabilidade estrita — então voltar para `on`.)
synchronous_commit = off

# NVMe: custo de página aleatória ~ sequencial; muito paralelismo de IO.
random_page_cost = 1.1
effective_io_concurrency = 200

# Log de queries lentas para caçar regressão no soak (dashboard/ingest).
log_min_duration_statement = 500ms
