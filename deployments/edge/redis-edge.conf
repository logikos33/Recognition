# redis-edge.conf — Redis como relay de detecções no edge (task-113).
# Include no redis.conf do box OU passar via `redis-server /caminho/redis-edge.conf`.
# POR QUÊ: no edge o Redis é BUFFER TRANSITÓRIO (pub/sub detections:{camera_id},
# ADR-0002), não banco. Precisa de teto de RAM e ZERO pico de fork (COW) que
# competiria com a inferência por memória unificada.

# Teto duro de memória. Complementa o MemoryMax do systemd (defesa em profundidade).
maxmemory 384mb

# Descarta as chaves mais antigas quando cheio, em vez de recusar escrita
# (noeviction travaria o produtor = pipeline). Detecção velha não importa no edge.
maxmemory-policy allkeys-lru

# Persistência OFF: elimina o fork de BGSAVE (pico de COW = risco de OOM sob
# pressão de memória unificada). O relay é reconstruível — DeepStream republica.
save ""
appendonly no

# Sem fork de rewrite de AOF (redundante com appendonly no, mas explícito).
aof-rewrite-incremental-fsync yes

# Bind local: o edge não expõe Redis à LAN (câmeras/rede via WireGuard outbound).
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# Log enxuto (evidência vai para journald via systemd).
loglevel notice
