name: Security Scan

on:
  push:
    branches: [develop, staging, main, "feature/**"]
  pull_request:
    branches: [develop, staging, main]

jobs:
  gitleaks:
    name: Secret detection (gitleaks)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    name: SAST (bandit)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Não-bloqueante na primeira rodada: 198 achados históricos sem triagem
    # (mesmo padrão do baseline de lint da Fase 0 — ver
    # docs/runbooks/sast-sca-baseline-phase0.md). Promover a bloqueante
    # depois de uma sprint de triagem.
    #
    # O "não-bloqueante" mora nos STEPS (continue-on-error no report + `|| true`
    # no summary), não no job. Não existe `continue-on-error` de job aqui de
    # propósito: ele fazia o workflow reportar success com job em failure —
    # falha de infra (pip, checkout) sumia do radar.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --quiet bandit
      - name: Run bandit against services/ (JSON report)
        continue-on-error: true
        run: bandit -r services/ -x '*/tests/*,*/test_*.py' -f json -o bandit-report.json
      - name: Bandit summary (log legível)
        if: always()
        run: bandit -r services/ -x '*/tests/*,*/test_*.py' || true
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  pip-audit:
    name: SCA (pip-audit)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # BLOQUEANTE desde 05/09. Estava com `continue-on-error: true` de job — o
    # que não deixava o job "avisar sem barrar", deixava o WORKFLOW dizer
    # success com o job em failure. As 7 matrizes estão verdes hoje (medido no
    # run 33852684937), então promover a bloqueante não trava ninguém agora e
    # passa a barrar advisory nova no caminho servido em Python.
    # Se um advisory sem correção travar o time: `pip-audit --ignore-vuln ID`
    # com issue + prazo, nunca `continue-on-error`.
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - base.txt
          - api.txt
          - auth.txt
          - worker.txt
          - inference.txt
          - celery-worker.txt
          - assistant-training.txt
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --quiet pip-audit
      - name: Audit requirements/${{ matrix.requirements }}
        run: pip-audit -r requirements/${{ matrix.requirements }} --desc

  npm-audit:
    name: SCA (npm audit)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, landing]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # `--package-lock-only` audita a árvore do lockfile, sem `npm ci`.
      #
      # Por que: o `npm ci --legacy-peer-deps` + `npm audit` de antes gastava
      # ~7min por app e, no HEAD da develop (run 33852684937), o frontend
      # morria em `400 Bad Request — Invalid package tree` do endpoint /quick.
      # Isso não é advisory nenhuma: é o audit engasgando na árvore instalada.
      # Lendo só o lock o resultado é o mesmo conjunto de advisories, em ~30s,
      # e sem o 400.
      - name: Auditar apps/${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: npm audit --package-lock-only --json > audit.json || true
      # Gate com allowlist EXPLÍCITA e DATADA (a alternativa honesta a fingir
      # verde). Regra: high/critical reprova, exceto pacote na allowlist — cada
      # entrada carrega a issue que a rastreia e o prazo em que ela morre.
      # Passado o prazo o gate reprova mesmo com a issue aberta; é o prazo que
      # impede a allowlist de virar mordaça permanente.
      #
      # A política e a lógica vivem em scripts/ci/check_npm_audit.py, ⛔ não num
      # heredoc aqui: gate de segurança embutido em YAML não roda em pytest, e
      # gate sem teste é a próxima #421. Testes:
      # services/api/tests/unit/ci/test_npm_audit_gate.py
      - name: Gate (allowlist datada)
        working-directory: apps/${{ matrix.app }}
        run: python3 ../../scripts/ci/check_npm_audit.py ${{ matrix.app }} < audit.json

  sbom:
    name: SBOM (Syft / CycloneDX)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Generate + upload SBOM (repo-wide, CycloneDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom-cyclonedx
