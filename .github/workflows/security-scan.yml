name: Security Scan

on:
  push:
    branches: [develop, staging, main, "feature/**"]
  pull_request:
    branches: [develop, staging, main]

jobs:
  gitleaks:
    name: Secret detection (gitleaks)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    name: SAST (bandit)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Não-bloqueante na primeira rodada: 198 achados históricos sem triagem
    # (mesmo padrão do baseline de lint da Fase 0 — ver
    # docs/runbooks/sast-sca-baseline-phase0.md). Promover a bloqueante
    # depois de uma sprint de triagem.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --quiet bandit
      - name: Run bandit against services/ (JSON report)
        continue-on-error: true
        run: bandit -r services/ -x '*/tests/*,*/test_*.py' -f json -o bandit-report.json
      - name: Bandit summary (log legível)
        if: always()
        run: bandit -r services/ -x '*/tests/*,*/test_*.py' || true
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  pip-audit:
    name: SCA (pip-audit)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Não-bloqueante na primeira rodada: requirements/ usam ranges (>=), não
    # pins exatos — ver PR fix/pin-python-deps para o lock com hashes.
    # Promover a bloqueante depois de uma sprint de triagem, igual ao bandit.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - base.txt
          - api.txt
          - auth.txt
          - worker.txt
          - inference.txt
          - celery-worker.txt
          - assistant-training.txt
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --quiet pip-audit
      - name: Audit requirements/${{ matrix.requirements }}
        run: pip-audit -r requirements/${{ matrix.requirements }} --desc

  npm-audit:
    name: SCA (npm audit)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # ⛔ `continue-on-error` REMOVIDO. Ele fazia o job rodar, imprimir as 5
    # vulnerabilidades da landing, e o workflow reportar SUCCESS mesmo assim —
    # `security-scan` verde com astro 4.16.19 vulnerável no lock (#421).
    # Verde assim não é prova de segurança: é a ausência da pergunta.
    #
    # O motivo original de não bloquear continua VÁLIDO e continua atendido: um
    # advisory que cruza o limiar não pode pintar de vermelho todo PR do repo.
    # A saída é a exceção ser EXPLÍCITA e ter PRAZO — apps/<app>/.audit-allowlist.json,
    # conferido por scripts/ci/check_npm_audit.py. Advisory novo reprova;
    # allowlist vencido reprova sozinho.
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, landing]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # Só audita o app que o PR REALMENTE tocou.
      #
      # Por que: `npm audit` consulta o registro ao vivo, então o resultado muda
      # sem ninguém commitar nada. Em 18/08 um advisory de astro cruzou o limiar
      # `high` e passou a pintar de vermelho TODO PR do repositório — inclusive
      # PRs só de Python. Vermelho que aparece em tudo deixa de ser sinal: a
      # próxima falha real vai parecer com essa e ser ignorada.
      #
      # Em push (sem PR) audita sempre — ali o alvo é a branch inteira, não um
      # diff, e é justamente onde se quer saber de advisory novo.
      - name: Este PR toca apps/${{ matrix.app }}?
        id: escopo
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "auditar=true" >> "$GITHUB_OUTPUT"
            echo "push — auditando sempre"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          if git diff --quiet "$base"...HEAD -- "apps/${{ matrix.app }}"; then
            echo "auditar=false" >> "$GITHUB_OUTPUT"
            echo "PR não toca apps/${{ matrix.app }} — pulando"
          else
            echo "auditar=true" >> "$GITHUB_OUTPUT"
            echo "PR toca apps/${{ matrix.app }} — auditando"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.escopo.outputs.auditar == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci --legacy-peer-deps
        if: steps.escopo.outputs.auditar == 'true'
        working-directory: apps/${{ matrix.app }}
      # `|| true` no npm: ele sai != 0 quando ACHA algo, e quem decide se isso
      # reprova é o gate — não o exit code cru do npm.
      - name: Gate de audit (allowlist datado)
        if: steps.escopo.outputs.auditar == 'true'
        run: |
          npm audit --json > audit.json || true
          python3 ../../scripts/ci/check_npm_audit.py . < audit.json
        working-directory: apps/${{ matrix.app }}

  sbom:
    name: SBOM (Syft / CycloneDX)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Generate + upload SBOM (repo-wide, CycloneDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom-cyclonedx
