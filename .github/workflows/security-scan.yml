name: Security Scan

on:
  push:
    branches: [develop, staging, main, "feature/**"]
  pull_request:
    branches: [develop, staging, main]

jobs:
  gitleaks:
    name: Secret detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    # Não-bloqueante na primeira rodada: 198 achados históricos sem triagem
    # (mesmo padrão do baseline de lint da Fase 0 — ver
    # docs/runbooks/sast-sca-baseline-phase0.md). Promover a bloqueante
    # depois de uma sprint de triagem.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --quiet bandit
      - name: Run bandit against services/ (JSON report)
        continue-on-error: true
        run: bandit -r services/ -x '*/tests/*,*/test_*.py' -f json -o bandit-report.json
      - name: Bandit summary (log legível)
        if: always()
        run: bandit -r services/ -x '*/tests/*,*/test_*.py' || true
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  pip-audit:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    # Não-bloqueante na primeira rodada: requirements/ usam ranges (>=), não
    # pins exatos — ver PR fix/pin-python-deps para o lock com hashes.
    # Promover a bloqueante depois de uma sprint de triagem, igual ao bandit.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - base.txt
          - api.txt
          - auth.txt
          - worker.txt
          - inference.txt
          - celery-worker.txt
          - training.txt
          - pre-annotation.txt
          - assistant-training.txt
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --quiet pip-audit
      - name: Audit requirements/${{ matrix.requirements }}
        run: pip-audit -r requirements/${{ matrix.requirements }} --desc

  npm-audit:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    # Não-bloqueante: dependências transitivas de dev geram ruído sem
    # impacto no bundle servido. Serve como sinal, não como gate.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, landing]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: apps/${{ matrix.app }}
      - run: npm audit --audit-level=high
        working-directory: apps/${{ matrix.app }}

  sbom:
    name: SBOM (Syft / CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Generate + upload SBOM (repo-wide, CycloneDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom-cyclonedx
