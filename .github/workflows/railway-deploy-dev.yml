name: Deploy → Railway Desenvolvimento

# Dispara somente quando CI verde no develop.
# Pré-requisito: adicione RAILWAY_TOKEN como GitHub Secret
# (Railway dashboard → Account Settings → API Tokens → New Token).
on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]

# Guard de concorrência (D-50): um burst de merges no develop gera um burst de
# `workflow_run` de CI verde, cada um disparando este workflow. Sem isto, N runs
# concorrentes chamam `railway up` quase simultaneamente e cada deploy supersede o
# anterior antes de estabilizar (containers vivem ~5-7s) — cascata de supersessão,
# não crash nem healthcheck ruim. group fixo (não por ref/sha) serializa TODOS os
# runs desta env: um novo run cancela o anterior ainda em fila/execução, então um
# burst colapsa num único deploy final (o mais recente vence). api e frontend estão
# no mesmo run (frontend usa `needs: deploy-api`), então um group único no nível do
# workflow cancela o pipeline inteiro de uma vez — evita ficar com api novo e
# frontend velho (ou vice-versa) de runs diferentes coexistindo.
concurrency:
  group: railway-deploy-dev
  cancel-in-progress: true

env:
  RAILWAY_PROJECT_ID: 7fd3ecdf-417d-41be-b892-ff8fc1907fdd

jobs:
  deploy-api:
    name: API-V3 → Desenvolvimento
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: develop

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy API-V3
        run: |
          railway up \
            --service "API-V3" \
            --environment "Desenvolvimento" \
            --detach \
            --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Smoke test /health
        run: |
          sleep 30
          curl -f --retry 5 --retry-delay 10 \
            https://api-v3-desenvolvimento.up.railway.app/health \
            || echo "::warning::Smoke test falhou — verifique logs Railway"

  deploy-frontend:
    name: Frontend → Desenvolvimento
    runs-on: ubuntu-latest
    needs: deploy-api
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: develop

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy Frontend
        run: |
          railway up \
            --service "frontend" \
            --environment "Desenvolvimento" \
            --detach \
            --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
