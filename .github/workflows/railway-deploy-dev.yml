name: Deploy → Railway Desenvolvimento

# ⚠️ ESTE ARQUIVO SÓ EXECUTA A PARTIR DE `main` (branch padrão).
# Esta cópia na `develop` existe para ser PROMOVIDA — ela corrige dois defeitos
# da versão que está em `main` hoje:
#
#  1. o nome do serviço estava em caixa baixa e o serviço se chama `Frontend`. O job
#     falhava com "Service not found" em TODA execução; o Frontend do DEV nunca
#     foi atualizado por este workflow (só pela integração git do Railway).
#
#  2. `railway up` faz deploy por UPLOAD e não carrega proveniência: o serviço
#     sobe sem `RAILWAY_GIT_COMMIT_SHA`, e o `/livez` passa a responder
#     `commit: "unknown"`. Foi ISSO que produziu o `unknown` de 29/08 — não um
#     deploy manual de laptop, como se supôs a princípio. Agora o SHA realmente
#     enviado é gravado em `GIT_COMMIT_SHA` antes de subir.
#
# ⚠️ O SHA é medido no checkout (`git rev-parse HEAD`), nunca fixo: fixar a
# proveniência é pior que não ter, porque passa a mentir com confiança.
#
# 🔴 E GRAVAR A VARIÁVEL NÃO É PROVA — corrigido em 05/09.
#    A variável e o código servido são INDEPENDENTES. Ela é escrita ANTES do
#    upload e sobrevive a ele: se o `railway up` falhar, subir outra árvore, ou
#    alguém subir de fora deste workflow (o que não toca a variável), o
#    `/livez` passa a afirmar, com confiança, um SHA que não está rodando.
#    Esse conserto trocou "não sei" (`unknown`) por "acho que sei" — pior,
#    porque desligou o único sinal honesto que existia.
#
#    Por isso o passo final deste job não é mais um smoke test de `/health`
#    (que só prova que ALGUÉM está de pé): é a checagem de proveniência, que
#    compara o `tree_digest` do serviço com o digest derivado da árvore que
#    acabamos de enviar. Ela reprova o deploy quando a declaração não confere
#    com o código. `--carencia-min 0` porque aqui não há o que esperar: o
#    deploy é este, agora.

# Dispara somente quando CI verde no develop.
# Pré-requisito: adicione RAILWAY_TOKEN como GitHub Secret
# (Railway dashboard → Account Settings → API Tokens → New Token).
on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]

env:
  RAILWAY_PROJECT_ID: 7fd3ecdf-417d-41be-b892-ff8fc1907fdd

jobs:
  deploy-api:
    name: API-V3 → Desenvolvimento
    # Sem isto o default do GitHub é 360 min: uma travada segura o runner por
    # 6 horas. O gate de higiene do CI cobra, e cobrou.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      # `--skip-deploys` é obrigatório: sem ele, mexer em variável dispara um
      # rebuild do source linkado e derruba a API (já aconteceu no DEV).
      - name: Gravar a proveniência do que vai subir
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "subindo $SHA"
          railway variables \
            --set "GIT_COMMIT_SHA=$SHA" \
            --service "API-V3" \
            --environment "Desenvolvimento" \
            --skip-deploys
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy API-V3
        run: |
          railway up \
            --service "API-V3" \
            --environment "Desenvolvimento" \
            --detach \
            --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Estava aqui um `curl /health || echo warning`: não reprovava nada e só
      # provava que algum processo respondia. A pergunta certa é outra —
      # "o que subiu é o que eu mandei subir?".
      - name: Provar que o que subiu é o que foi enviado
        run: |
          URL=https://api-v3-desenvolvimento.up.railway.app/livez

          # O deploy é assíncrono (`--detach`): espera o processo NOVO atender.
          # `--retry-all-errors` cobre o 502 do intervalo entre matar o antigo
          # e promover o novo.
          curl -fsS --retry 12 --retry-delay 15 --retry-all-errors "$URL" > /dev/null

          python3 scripts/checa_proveniencia.py --url "$URL" \
            --branch HEAD --carencia-min 0

  deploy-frontend:
    name: Frontend → Desenvolvimento
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: deploy-api
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy Frontend
        run: |
          railway up \
            --service "Frontend" \
            --environment "Desenvolvimento" \
            --detach \
            --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
