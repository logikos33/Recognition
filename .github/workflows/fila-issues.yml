name: Fila de issues (semanal)

# Contagem + idade das issues abertas, uma vez por semana, no resumo do run.
# Só LÊ e imprime — não abre, não fecha, não comenta. A jardinagem é decisão
# humana; isto impede que o estoque cresça sem ninguém ver.
#
# Sem criação de issue de propósito: um robô que abre issue toda semana para
# falar de issues é exatamente a cerimônia que esta pista veio cortar.
on:
  schedule:
    - cron: "0 12 * * 1" # segunda, 12:00 UTC (09:00 BRT)
  workflow_dispatch: # rodar sob demanda

permissions:
  issues: read

jobs:
  relatorio:
    name: Contagem e idade da fila
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Stdlib + gh (já instalado no runner). Sem pip install.
      - name: Relatório da fila
        run: python scripts/ci/issues_report.py >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
