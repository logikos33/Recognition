name: CI

on:
  push:
    branches: [develop, staging, main, "feature/**"]
  pull_request:
    branches: [develop, staging, main]

jobs:
  license-gate:
    name: License gate (no AGPL/GPL in serving path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run license gate
        run: python scripts/check_license_gate.py

      # --- Varredura estática (rápida, sem instalar torch) ---
      # requirements/training.* foi deletado (task "treino não pode mentir" —
      # ultralytics/Roboflow legado removido); training/vast/remote_train.py
      # (o runner honesto que sobrou) instala RF-DETR/YOLOX em runtime na
      # instância Vast.ai, fora do controle de requirements deste repo.
      - name: Static scan — all serving requirements
        run: |
          python scripts/scan_requirements_licenses.py \
            requirements/base.txt \
            requirements/api.txt \
            requirements/worker.txt \
            requirements/inference.txt \
            requirements/celery-worker.txt

      # --- Auditoria completa com pip-licenses (apenas api.txt — sem torch) ---
      # Duas chamadas separadas: requirements/api.txt tem hashes (ativa
      # --require-hashes implicitamente no pip), que exige que TODO pacote da
      # mesma chamada tenha hash — pip-licenses não tem hash, por isso vai
      # numa invocação própria.
      - name: Install api requirements (lightweight, sem ML)
        run: pip install -r requirements/api.txt
      - name: Install pip-licenses
        run: pip install --quiet pip-licenses

      - name: Full pip-licenses audit (api.txt)
        run: |
          pip-licenses --format=json --output-file=licenses-api.json
          python scripts/check_licenses.py licenses-api.json

      - name: Generate THIRD_PARTY_NOTICES
        run: |
          pip-licenses \
            --format=plain-vertical \
            --with-license-file \
            --no-license-path \
            --output-file=THIRD_PARTY_NOTICES

      - name: Upload license artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-report
          path: |
            licenses-api.json
            THIRD_PARTY_NOTICES
          if-no-files-found: ignore

  lockfile-check:
    name: Lockfile freshness (pip-compile --generate-hashes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Pinado: pip 26.2 tornou `allow_editables` keyword-only obrigatório em
      # RequirementCommand.make_requirement_preparer(), mas pip-tools 7.6.0
      # (a mesma versão que gerou os locks commitados) não passa esse
      # argumento — TypeError em toda recompilação. pip==26.1.2 é a última
      # patch da linha anterior à quebra; verificado localmente (venv Python
      # 3.11 limpa) que este par não diverge dos requirements/*.txt já
      # commitados (zero diff em base/api/auth/celery-worker/assistant-training;
      # inference/training/worker só diferem nos pacotes nvidia-*/triton/
      # cuda-* — presença condicionada a marker de plataforma Linux, ausentes
      # ao compilar em macOS, não uma divergência real de versão/hash).
      - run: pip install --quiet "pip==26.1.2" "pip-tools==7.6.0"
      # Recompila cada requirements/*.txt a partir do .in correspondente e
      # falha se o resultado divergir do commitado — pega lock desatualizado
      # (alguém editou o .in sem recompilar, ou editou o .txt à mão).
      # requirements/pre-annotation.txt foi removido (era arquivo órfão, não
      # referenciado por nixpacks.toml/railway_start.py — o serviço real
      # instala de pre-annotation-service/requirements.txt) — ver
      # docs/runbooks/pre-annotation-dependency-conflict.md.
      # requirements/training.{in,txt} foi deletado (task "treino não pode
      # mentir" — ultralytics/Roboflow legado removido, nada mais compila
      # esse par) — fora do loop abaixo.
      - name: Recompilar locks e comparar com o commit
        run: |
          set -e
          for name in base api auth celery-worker worker inference assistant-training; do
            extra_args=""
            if [ "$name" != "base" ]; then
              extra_args="--constraint=requirements/base.txt"
            fi
            pip-compile --generate-hashes --allow-unsafe --resolver=backtracking \
              $extra_args \
              --output-file="requirements/$name.txt" "requirements/$name.in"
          done
          git diff --exit-code -- requirements/ || {
            echo "::error::Lockfiles divergem do que 'pip-compile --generate-hashes' gera hoje. Rode o comando localmente e commite o resultado.";
            exit 1;
          }

  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check services/api/

  pytest:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      # pgvector/pgvector:pg15 (não postgres:15 puro) — mesma imagem do job
      # "Migrations harness": a migration 036 (assistant RAG) faz
      # `CREATE EXTENSION vector`, ausente no postgres:15 vanilla. Drop-in
      # compatível, não muda nada para os testes unitários (recognition_test).
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: recognition_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Duas chamadas: requirements/api.txt tem hashes (--require-hashes
      # implícito no pip); pytest/pytest-cov não têm hash, então vão separados.
      - run: pip install -r requirements/api.txt
      - run: pip install pytest pytest-cov
      # tests/integration/ (56 testes, task 2.0 mutirão) esperava um Postgres
      # JÁ MIGRADO em INTEGRATION_DATABASE_URL/HARNESS_DATABASE_URL — sem essa
      # variável, tests/integration/conftest.py faz `pytest.skip` em todos.
      # Banco SEGUNDO (recognition_integration) no MESMO service postgres,
      # nunca o recognition_test dos testes unitários — zero risco de colisão
      # de estado entre as duas suítes. Schema aplicado com o runner do
      # harness de migrations (D1), passada única, fiel ao boot real
      # (railway_start.py: infra/migrations/*.sql em ordem, tolerando os
      # mesmos erros legados conhecidos que a produção ignora).
      - name: Criar banco de integração e aplicar migrations (schema real)
        run: |
          PGPASSWORD=test psql -h localhost -U test -d recognition_test -c "CREATE DATABASE recognition_integration;"
          python tests/harness/migrations/runner.py --dsn postgresql://test:test@localhost:5432/recognition_integration --pass 1
      # Paths relativos ao rootdir=services/api/ (pyproject.toml define [tool.pytest.ini_options] lá)
      # --cov-config explícito porque CWD é a raiz do repo, não services/api/
      # SEM INTEGRATION_DATABASE_URL aqui (de propósito): com a variável, os
      # testes de integração rodam no MESMO processo pytest dos unitários e
      # primam singletons de processo (ReadinessCache do health honesto,
      # DatabasePool) com o Postgres/Redis REAIS do CI — unit tests que mockam
      # a dependência por fora passam a ler estado real/cacheado e quebram
      # (ex.: test_database_false_triggers_degraded esperava degraded/503,
      # obtinha healthy/200 no PR #270). Neste step os 56 de integração
      # aparecem como skipped — eles rodam no step isolado logo abaixo.
      - run: |
          pytest services/api/tests/ -v --tb=short -q --cov=app --cov-report=term-missing --cov-fail-under=60 --cov-config=services/api/pyproject.toml
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/recognition_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: ci-test-secret-key-32chars-minimum
          SERVICE_TYPE: api
      # Processo pytest NOVO só para tests/integration: zero poluição de
      # singleton nas duas direções (os unitários não herdam pools/caches
      # reais, e a integração não herda mocks/estado dos unitários).
      # INTEGRATION_DATABASE_URL definida SÓ aqui. --no-cov: o gate de
      # cobertura (--cov-fail-under=60 do addopts) é responsabilidade do
      # step principal; este step valida comportamento contra o schema real.
      - name: Integration tests (processo isolado)
        run: |
          pytest services/api/tests/integration -v --tb=short -q --no-cov
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/recognition_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: ci-test-secret-key-32chars-minimum
          SERVICE_TYPE: api
          INTEGRATION_DATABASE_URL: postgresql://test:test@localhost:5432/recognition_integration
      # Suíte do pre-annotation-service (conexão mockada — sem deps de ML).
      # Sem este step o teste do fix de active_learning nunca roda no CI.
      - name: pre-annotation-service tests
        run: pytest pre-annotation-service/tests/ -v --tb=short -q -p no:cacheprovider --override-ini addopts=
      # Suíte do services/inference (task-082 — detectores ONNX RF-DETR/YOLOX,
      # seleção por arquitetura, fail-loud ultralytics). onnxruntime é mockado;
      # cv2/numpy já vêm de requirements/api.txt (base.txt).
      - name: services/inference tests
        run: pytest services/inference/tests/ -v --tb=short -q -p no:cacheprovider --override-ini addopts=
      # remote_train.py roda na GPU remota (fora de services/api/) — fake
      # mínimo de rfdetr, sem instalar torch/ML. Cobre a acumulação de
      # métricas por-época (achado da revisão adversarial da Fase A).
      - name: remote_train.py tests (Vast.ai runner)
        run: pytest training/vast/test_remote_train.py -v --tb=short -q
      # propagate_seeded.py roda na GPU remota (fora de services/api/),
      # mesmo padrão de remote_train.py acima — só a seção PURA (matching
      # por similaridade de cosseno, conversão de bbox, guard de sha256 dos
      # pesos) é exercitada aqui; torch/cv2/segment-anything nunca são
      # importados no top-level do módulo (lazy import dentro das funções
      # de GPU), então nenhuma dependência de ML precisa estar instalada.
      - name: propagate_seeded.py tests (RunPod propagation runner)
        run: pytest training/test_propagate_seeded.py -v --tb=short -q
      # Suíte do edge-sync-agent (task-090 — mini-API local de evidência
      # RS256, config/command pollers, buffer SQLite, uploader; task-091 —
      # RecorderClient ONVIF/RTSP real). Flask/PyJWT/cryptography já vêm de
      # requirements/api.txt (base.txt), mas httpx (SOAP ONVIF real,
      # onvif_recorder_client.py) só está no requirements.txt PRÓPRIO do
      # serviço — instala ele também em vez de confiar só no atalho de
      # api.txt (que quebrou quando task-091 passou a importar httpx de
      # verdade, não só via http_client injetado/mockado como antes).
      - name: Install edge-sync-agent requirements
        run: pip install -r services/edge-sync-agent/requirements.txt
      - name: services/edge-sync-agent tests
        run: pytest services/edge-sync-agent/tests/ -v --tb=short -q -p no:cacheprovider --override-ini addopts=

  tsc:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: apps/frontend
      - run: npx tsc --noEmit
        working-directory: apps/frontend

  migrations-hygiene:
    name: Migrations hygiene (prefixo/diretório duplicado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Sem banco, sem deps externas — checagem pura de filesystem. Fica num
      # job próprio (não dentro de migrations-harness) para não pagar o custo
      # de subir Postgres só para um check que não precisa dele; roda em
      # segundos e falha cedo se alguém introduzir uma colisão de prefixo nova
      # ou um segundo diretório de migrations (ADR-0021).
      - name: Guard-rails de higiene (prefixo duplicado, diretório duplicado)
        run: python scripts/ci/check_migrations_hygiene.py

  migrations-collision-guard:
    name: Migrations collision guard (numeração NNN entre PRs paralelos)
    # Só roda em pull_request: o check (2) compara contra OUTROS PRs abertos
    # e o check (1) usa github.event.pull_request.base.ref/head.sha, que só
    # existem nesse evento. Em push direto (já mergeado) não há mais o que
    # checar — a colisão, se existisse, já teria sido pega aqui antes do merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # check (2): listar outros PRs abertos e seus arquivos via `gh api`
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # fetch-depth 0 = histórico completo de todas as branches: precisamos
          # de origin/<base-ref> local para calcular o merge-base REAL do PR
          # (nunca HEAD~1 — não tem relação com "o que este PR adiciona" se o
          # PR tiver mais de 1 commit ou se a base tiver avançado desde o branch).
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # gh CLI já vem instalado nos runners hospedados do GitHub — só precisa
      # de GH_TOKEN no ambiente. check (1) é determinístico e sempre roda;
      # check (2) é best-effort (ver docstring do script) e nunca derruba o
      # build sozinho — só uma colisão CONFIRMADA falha.
      - name: Guard-rail de colisão de numeração (contra a base e contra outros PRs abertos)
        run: |
          python scripts/ci/check_migrations_collision.py \
            --base-ref "${{ github.event.pull_request.base.ref }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

  migrations-harness:
    name: Migrations harness (D1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: recognition_harness
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r tests/harness/migrations/requirements.txt
      # pg_dump é usado pelo diff de idempotência (passos abaixo). ubuntu-latest
      # costuma já ter postgresql-client, mas instala explicitamente se faltar
      # em vez de confiar em ambiente do runner (pode variar entre imagens).
      - name: Garantir pg_dump disponível
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y postgresql-client
          fi
          pg_dump --version
      - name: Passada 1 — banco limpo
        run: python tests/harness/migrations/runner.py --pass 1
        env:
          HARNESS_DATABASE_URL: postgresql://harness:harness@localhost:55432/recognition_harness
      - name: Dump de schema — passada 1
        run: bash tests/harness/migrations/dump_schema.sh "$HARNESS_DATABASE_URL" /tmp/schema_pass1.sql
        env:
          HARNESS_DATABASE_URL: postgresql://harness:harness@localhost:55432/recognition_harness
      - name: Passada 2 — idempotência (C-02)
        run: python tests/harness/migrations/runner.py --pass 2
        env:
          HARNESS_DATABASE_URL: postgresql://harness:harness@localhost:55432/recognition_harness
      - name: Dump de schema — passada 2
        run: bash tests/harness/migrations/dump_schema.sh "$HARNESS_DATABASE_URL" /tmp/schema_pass2.sql
        env:
          HARNESS_DATABASE_URL: postgresql://harness:harness@localhost:55432/recognition_harness
      # C-02 em profundidade: exit 0 nas duas passadas (acima) só prova que
      # nenhum arquivo lançou erro fatal — não prova que o SCHEMA final é o
      # mesmo. Uma migration pode "passar" nas duas passadas e ainda assim
      # produzir estados diferentes (DDL condicional dependente de ordem, DROP
      # sem guarda, etc.) — exatamente a classe de bug que ADR-0021 descreve.
      # A divergência HISTÓRICA já conhecida (dívida das migrations 011/049,
      # em triagem humana — ver tests/harness/migrations/README.md) fica
      # registrada em tests/harness/migrations/.schema-diff-baseline: o check
      # só falha para delta NOVO fora da baseline, que deve encolher e nunca
      # crescer.
      - name: Diff de schema entre passada 1 e passada 2 (C-02, com baseline)
        run: |
          if ! python tests/harness/migrations/schema_diff_check.py /tmp/schema_pass1.sql /tmp/schema_pass2.sql; then
            echo "::error::Delta NOVO de schema entre a passada 1 e a passada 2 — viola C-02 (idempotência). Ver delta acima."
            exit 1
          fi
      - name: pytest — asserts de schema
        run: pytest tests/harness/migrations/ -v
        env:
          HARNESS_DATABASE_URL: postgresql://harness:harness@localhost:55432/recognition_harness

  frontend:
    name: Frontend tests (tsc + vitest + playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: apps/frontend
      - name: Type check
        run: npx tsc --noEmit
        working-directory: apps/frontend
      - name: Unit tests (vitest)
        run: npm run test
        working-directory: apps/frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/frontend
      - name: E2E smoke test (playwright)
        run: npm run test:e2e
        working-directory: apps/frontend
