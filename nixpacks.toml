[phases.setup]
# postgresql_18: o `pg_dump` do backup (tasks/backup.py). O servidor do Railway
# é PostgreSQL 18.6 e o pg_dump NÃO pode ser mais antigo que o servidor —
# com uma versão anterior ele recusa o dump em vez de gerar arquivo torto.
nixPkgs = ["python311", "gcc", "nodejs-18_x", "ffmpeg", "libgcc", "stdenv.cc.cc.lib", "postgresql_18"]

[phases.install]
cmds = [
  "python3 -m pip install --upgrade pip",
  "if [ \"$SERVICE_TYPE\" = 'worker' ]; then python3 -m pip install -r requirements/worker.txt; elif [ \"$SERVICE_TYPE\" = 'celery-worker' ]; then python3 -m pip install -r requirements/celery-worker.txt; else python3 -m pip install -r requirements/api.txt; fi",
  "if [ \"$SERVICE_TYPE\" = 'landing-page' ]; then cd apps/landing && npm ci && npm run build; fi"
]

[start]
cmd = "python3 railway_start.py"
